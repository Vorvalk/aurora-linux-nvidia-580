# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: aurora-legacy-nvidia-580
description: Aurora linux system with locked Nvidia 580 driver.

base-image: ghcr.io/ublue-os/kinoite-main
image-version: 44

modules:
  # 1. Ativate RPM Fusion for legacy
  - type: rpm-ostree
    repos:
      - https://rpmfusion.org
      - https://rpmfusion.org

  # 2. Inject branch Nvidia 580xx
  - type: akmods
    install:
      - nvidia
    nvidia-driver: nvidia
    packages:
      - akmod-nvidia-580xx
      - xorg-x11-drv-nvidia-580xx
      - xorg-x11-drv-nvidia-580xx-libs

  # 3. Include uBlue tools
  - type: default-flatpaks
  - type: signing
