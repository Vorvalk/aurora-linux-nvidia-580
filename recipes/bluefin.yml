# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: meu-bluefin-gtx1060
description: Bluefin customizado com drivers NVIDIA trancados na serie 580 para GTX 1060.

# Herdando diretamente a imagem oficial do Bluefin com drivers proprietários
base-image: ghcr.io/projectbluefin/bluefin-nvidia
image-version: stable

modules:
  # 1. Ativar os repositórios RPM Fusion necessários para o bloqueio de pacotes
  - type: rpm-ostree
    repos:
      - https://rpmfusion.org
      - https://rpmfusion.org

  # 2. Executar o script que tranca a versão do driver Nvidia na versão 580
  - type: script
    snippets:
      - |
        #!/usr/bin/env bash
        set -xe
        # Força o sistema a ignorar atualizações de drivers Nvidia além da série 580
        echo "exclude=xorg-x11-drv-nvidia* kmod-nvidia*" >> /etc/dnf/dnf.conf
        echo "exclude=xorg-x11-drv-nvidia* kmod-nvidia*" >> /etc/rpm-ostree.conf
